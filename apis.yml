aid: qapital
name: Qapital
description: >-
  Qapital is a consumer personal-finance company founded in 2013 — "born in Stockholm, raised in New
  York City" — that packages saving, spending, investing and budgeting into a single mobile membership
  app built on behavioral-economics research. Its Rules engine automates transfers into user-defined
  Goals (round-ups, guilty pleasure, payday divvy, freelancer tax set-aside and activity-triggered
  saves), a Dream Team feature lets two people save collaboratively, Qapital Invest offers
  risk-weighted portfolios through SEC-registered advisory and brokerage partners, and a Qapital Visa
  debit card and Spending account run on FDIC-member partner banking. The company reports 3.5m+ app
  downloads and roughly $3B collectively saved by members. Qapital sells a subscription — Basic,
  Complete and Premier tiers — rather than a developer product: it publishes no developer portal, no
  API reference and no machine-readable contract of any kind. The only public automation surface it
  offers is a Qapital service on IFTTT (four triggers, three queries, one action), and its own
  api.qapital.com host answers anonymous requests with HTTP 503.
