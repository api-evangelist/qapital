note: >-
  This is the ONLY public programmable surface Qapital exposes, and it is hosted by IFTTT rather
  than by Qapital. It is a marketplace-style integration, not an API: there is no published base
  URL, no schema, no auth documentation and no rate limits on Qapital's side — an end user connects
  their Qapital account to IFTTT through an OAuth-style consent flow and composes applets in
  IFTTT's UI. Captured because it is real, first-party (Qapital publishes and maintains the
  service — see https://www.qapital.com/blog/ifttt-rules-are-supercharging-your-savings/ and the
  company's own /blog/category/ifttt/ section), and because it is the closest thing to an event
  surface Qapital has. Names and descriptions are quoted verbatim from the IFTTT service page; no
  input/output field schemas are published there, so none are recorded here.
