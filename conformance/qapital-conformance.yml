note: >-
  Qapital publishes no machine-readable contract, so every API/interface standard below is asserted
  false on evidence of absence rather than on a spec reading. The conformance that IS real for this
  company is regulatory and audit-based, and it is recorded first. Domain-standard conformance
  (FDX, Open Banking / PSD2, ISO 20022, FAPI) is NOT claimed: Qapital is the consumer end of retail
  banking and does not publish a data-sharing contract of its own — third-party access to Qapital
  account data runs through aggregators, not through a Qapital-published standard implementation.
